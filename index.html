<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Configurações de PWA e Cor do Tema para Android -->
    <meta name="theme-color" content="#090d16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MeuTreino Pro" />
    
    <!-- Link para o Manifesto do PWA (Essencial para o Android habilitar a instalação) -->
    <link rel="manifest" href="/manifest.json" />

    <title>MeuTreino Pro</title>
    <meta name="description" content="Plataforma avançada de periodização para hipertrofia individualizada com cálculo de volume MEV/MAV/MRV, biomecânica e sobrecarga progressiva preditiva." />
    
    <!-- Open Graph / Twitter -->
    <meta property="og:title" content="MeuTreino Pro" />
    <meta property="og:description" content="Plataforma avançada de periodização para hipertrofia individualizada com cálculo de volume MEV/MAV/MRV, biomecânica e sobrecarga progressiva preditiva." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Script de Tema (Dark / Light) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('meutreino_theme');
          var mode = localStorage.getItem('meutreino_theme_mode');
          var systemPrefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = 'dark';
          if (mode === 'system' || (!saved && !mode)) {
            theme = systemPrefersLight ? 'light' : 'dark';
          } else if (saved === 'light' || saved === 'dark') {
            theme = saved;
          } else {
            theme = systemPrefersLight ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('theme-light');
          } else {
            document.documentElement.classList.remove('theme-light');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
