<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MeuTreino Pro</title>
    <meta name="description" content="Plataforma avançada de periodização para hipertrofia individualizada com cálculo de volume MEV/MAV/MRV, biomecânica e sobrecarga progressiva preditiva." />
    <meta name="theme-color" id="meta-theme-color" content="#0d1424" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MeuTreino" />
    <meta name="application-name" content="MeuTreino Pro" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />
    <meta property="og:title" content="MeuTreino Pro" />
    <meta property="og:description" content="Plataforma avançada de periodização para hipertrofia individualizada com cálculo de volume MEV/MAV/MRV, biomecânica e sobrecarga progressiva preditiva." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        // Captura o evento beforeinstallprompt imediatamente antes mesmo do React montar (crucial no Android Chrome)
        window.__deferredPWAInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) {
          e.preventDefault();
          window.__deferredPWAInstallPrompt = e;
          window.dispatchEvent(new CustomEvent('meutreino:pwa-prompt-ready'));
        });

        // Limpa caches obsoletos de versões antigas do Service Worker
        if ('caches' in window) {
          caches.keys().then(function(names) {
            names.forEach(function(name) {
              if (name.indexOf('meutreino-sw-v5.0') === -1) {
                caches.delete(name);
              }
            });
          }).catch(function() {});
        }

        function syncTheme(e) {
          try {
            var mode = localStorage.getItem('meutreino_theme_mode');
            var saved = localStorage.getItem('meutreino_theme');
            var accent = localStorage.getItem('meutreino_accent_color') || 'emerald';
            var mql = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)');
            var isSystemLight = (e && typeof e.matches === 'boolean') ? e.matches : (mql ? mql.matches : false);

            var theme = 'dark';
            if (mode === 'system' || (!saved && !mode)) {
              theme = isSystemLight ? 'light' : 'dark';
            } else if (saved === 'light' || saved === 'dark' || saved === 'oled') {
              theme = saved;
            } else if (mode === 'light' || mode === 'dark' || mode === 'oled') {
              theme = mode;
            } else {
              theme = isSystemLight ? 'light' : 'dark';
            }

            var root = document.documentElement;
            root.setAttribute('data-theme', theme);
            root.setAttribute('data-accent', accent);
            root.style.colorScheme = theme === 'light' ? 'light' : 'dark';

            if (document.body) {
              document.body.setAttribute('data-theme', theme);
              document.body.setAttribute('data-accent', accent);
            }

            if (theme === 'light') {
              root.classList.remove('dark', 'theme-oled');
              root.classList.add('theme-light');
            } else if (theme === 'oled') {
              root.classList.remove('theme-light');
              root.classList.add('dark', 'theme-oled');
            } else {
              root.classList.remove('theme-light', 'theme-oled');
              root.classList.add('dark');
            }

            var paletteMap = {
              emerald: { base: '16, 185, 129', hover: '52, 211, 153', active: '#34d399' },
              gold: { base: '245, 158, 11', hover: '251, 191, 36', active: '#fbbf24' },
              cyan: { base: '6, 182, 212', hover: '34, 211, 238', active: '#22d3ee' },
              crimson: { base: '244, 63, 94', hover: '251, 113, 133', active: '#fb7185' }
            };
            var p = paletteMap[accent] || paletteMap.emerald;
            var styleEl = document.getElementById('meutreino-scrollbar-theme');
            if (!styleEl) {
              styleEl = document.createElement('style');
              styleEl.id = 'meutreino-scrollbar-theme';
              document.head.appendChild(styleEl);
            }
            styleEl.textContent =
              '::-webkit-scrollbar, html::-webkit-scrollbar, body::-webkit-scrollbar, *::-webkit-scrollbar { width: 6px !important; height: 6px !important; background: transparent !important; background-color: transparent !important; }' +
              '::-webkit-scrollbar-track, ::-webkit-scrollbar-track-piece, html::-webkit-scrollbar-track, body::-webkit-scrollbar-track, *::-webkit-scrollbar-track { background: transparent !important; background-color: transparent !important; border: none !important; box-shadow: none !important; }' +
              '::-webkit-scrollbar-thumb, html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb, *::-webkit-scrollbar-thumb { background: rgba(' + p.base + ', 0.55) !important; background-color: rgba(' + p.base + ', 0.55) !important; border-radius: 9999px !important; border: none !important; }' +
              '::-webkit-scrollbar-thumb:hover, html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover, *::-webkit-scrollbar-thumb:hover { background: rgba(' + p.hover + ', 0.85) !important; background-color: rgba(' + p.hover + ', 0.85) !important; }' +
              '::-webkit-scrollbar-thumb:active, html::-webkit-scrollbar-thumb:active, body::-webkit-scrollbar-thumb:active, *::-webkit-scrollbar-thumb:active { background: ' + p.active + ' !important; background-color: ' + p.active + ' !important; }' +
              '::-webkit-scrollbar-button, ::-webkit-scrollbar-corner { display: none !important; width: 0 !important; height: 0 !important; background: transparent !important; }';

            var metaTheme = document.getElementById('meta-theme-color');
            if (metaTheme) {
              metaTheme.setAttribute(
                'content',
                theme === 'light' ? '#f8fafc' : theme === 'oled' ? '#000000' : '#0d1424'
              );
            }

            window.dispatchEvent(new CustomEvent('meutreino:theme-updated', {
              detail: { theme: theme, mode: mode, isSystemLight: isSystemLight }
            }));
          } catch (err) {}
        }

        // Execução síncrona anti-flicker no carregamento inicial
        syncTheme();

        // Escuta alterações em tempo real de prefers-color-scheme no sistema operacional
        if (window.matchMedia) {
          try {
            var mediaQuery = window.matchMedia('(prefers-color-scheme: light)');
            if (typeof mediaQuery.addEventListener === 'function') {
              mediaQuery.addEventListener('change', syncTheme);
            } else if (typeof mediaQuery.addListener === 'function') {
              mediaQuery.addListener(syncTheme);
            }
          } catch (e) {}
        }

        // Sincronização em tempo real entre abas no mesmo navegador
        window.addEventListener('storage', function(e) {
          if (e.key === 'meutreino_theme' || e.key === 'meutreino_theme_mode' || e.key === 'meutreino_accent_color') {
            syncTheme();
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
