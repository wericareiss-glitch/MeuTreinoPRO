<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#090d1a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-dasharray="16 12" stroke-opacity="0.4" />

  <!-- Central Dumbbell Icon (Geometric Pro Style) -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="186" y="240" width="140" height="32" rx="12" fill="#e2e8f0" />
    <rect x="220" y="244" width="72" height="24" rx="6" fill="#94a3b8" />

    <!-- Left Inner Collar -->
    <rect x="170" y="226" width="16" height="60" rx="6" fill="#cbd5e1" />
    <!-- Left Main Plate -->
    <rect x="134" y="196" width="30" height="120" rx="12" fill="url(#accentGrad)" />
    <!-- Left Outer Plate -->
    <rect x="108" y="214" width="22" height="84" rx="9" fill="#10b981" />

    <!-- Right Inner Collar -->
    <rect x="326" y="226" width="16" height="60" rx="6" fill="#cbd5e1" />
    <!-- Right Main Plate -->
    <rect x="348" y="196" width="30" height="120" rx="12" fill="url(#accentGrad)" />
    <!-- Right Outer Plate -->
    <rect x="382" y="214" width="22" height="84" rx="9" fill="#10b981" />
  </g>

  <!-- Dynamic Lightning Bolt in Center for "Pro / Sobrecarga" -->
  <path d="M268 140 L204 268 L256 268 L244 372 L316 236 L260 236 Z" fill="url(#boltGrad)" filter="url(#glow)" stroke="#090d1a" stroke-width="4" stroke-linejoin="round" />
</svg>
