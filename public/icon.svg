<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <style>
      .bar-main { fill: #e2e8f0; }
      .bar-inner { fill: #94a3b8; }
      .collar { fill: #cbd5e1; }
      .bolt-stroke { stroke: #0f172a; }
      @media (prefers-color-scheme: light) {
        .bar-main { fill: #1e293b; }
        .bar-inner { fill: #475569; }
        .collar { fill: #334155; }
        .bolt-stroke { stroke: #ffffff; }
      }
    </style>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fundo 100% Transparente (adapta-se ao tema escolhido) -->
  <!-- Anel Externo Tracejado Original -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="18 14" stroke-opacity="0.55" />

  <!-- Halter Central Original (Geometric Pro Style) -->
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)" filter="url(#glow)">
    <!-- Barra Central -->
    <rect x="186" y="240" width="140" height="32" rx="12" class="bar-main" />
    <rect x="220" y="244" width="72" height="24" rx="6" class="bar-inner" />

    <!-- Colar Interno Esquerdo -->
    <rect x="170" y="226" width="16" height="60" rx="6" class="collar" />
    <!-- Anilha Principal Esquerda -->
    <rect x="134" y="196" width="30" height="120" rx="12" fill="url(#accentGrad)" />
    <!-- Anilha Externa Esquerda -->
    <rect x="108" y="214" width="22" height="84" rx="9" fill="#10b981" />

    <!-- Colar Interno Direito -->
    <rect x="326" y="226" width="16" height="60" rx="6" class="collar" />
    <!-- Anilha Principal Direita -->
    <rect x="348" y="196" width="30" height="120" rx="12" fill="url(#accentGrad)" />
    <!-- Anilha Externa Direita -->
    <rect x="382" y="214" width="22" height="84" rx="9" fill="#10b981" />
  </g>

  <!-- Raio Central Original ("Pro / Sobrecarga") -->
  <path d="M268 140 L204 268 L256 268 L244 372 L316 236 L260 236 Z" fill="url(#boltGrad)" filter="url(#glow)" class="bolt-stroke" stroke-width="5" stroke-linejoin="round" />
</svg>
